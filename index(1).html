<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Copa Gana o Asa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#e3eaf1; --ink:#0b1d2e; --muted:#556b7c; --line:#d0dbe5;
  --court:#0a5cb8; --ball:#dfee3b; --ball-ink:#1a2300; --good:#0d7a44; --danger:#b83227;
  --disp:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1c2e; --surface:#10283f; --surface2:#17324d; --ink:#eaf2f8; --muted:#8fa9bd; --line:#21425f;
    --court:#0f6bc9; --ball:#e6f24a; --ball-ink:#1a2300; --good:#4bd88b; --danger:#ff8578;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1c2e; --surface:#10283f; --surface2:#17324d; --ink:#eaf2f8; --muted:#8fa9bd; --line:#21425f;
  --court:#0f6bc9; --ball:#e6f24a; --ball-ink:#1a2300; --good:#4bd88b; --danger:#ff8578;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
h1,h2{margin:0}

/* header */
.top{margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.ball{width:22px;height:22px;border-radius:50%;background:var(--ball);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ball::before,.ball::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:60%;border:2px solid rgba(255,255,255,.9);border-radius:50%;clip-path:inset(0 0 50% 0);transform:translateY(-95%)}
.ball::after{transform:translateY(-5%) rotate(180deg)}
.brand h1{font:800 32px/1 var(--disp);letter-spacing:.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}

/* sections */
.sec{margin:26px 0 0}
.sec h2{font:700 22px/1.1 var(--disp);letter-spacing:.01em;margin-bottom:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.sec-head h2{margin:0}
.hint{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.err{color:var(--danger);font-weight:600;margin:0 0 10px;font-size:14px}

/* buttons */
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 16px var(--body);padding:0 14px}
.btn.primary{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{min-height:40px;font-size:14px;flex:none;padding:0 12px}

/* progress */
.prog{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.prog .now{font:800 44px/0.9 var(--disp)}
.prog .of{font:600 20px var(--disp);color:var(--muted);margin-left:4px}
.prog small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.stepper{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.stepper button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 20px var(--body);line-height:1}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--court);border-radius:3px;transition:width .3s}

/* court (the hero) */
.court{position:relative;background:var(--court);color:#fff;border-radius:20px;margin-top:16px;overflow:hidden}
.court::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.55);border-radius:13px;pointer-events:none}
.half{padding:26px 24px 20px}
.half .who{font-size:13px;opacity:.85;margin-bottom:2px}
.pl{font:800 34px/1.02 var(--disp);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.pl .amp{color:var(--ball);padding:0 2px}
.win-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.win-row .lbl{font-size:13px;opacity:.85;margin-right:2px;white-space:nowrap}
.pill{flex:1;min-height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:700 24px var(--disp)}
.pill.on{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.net{position:relative;height:0;border-top:3px dashed rgba(255,255,255,.7);margin:0 22px}
.net .ballmark{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--ball)}
.confirm{padding:2px 24px 26px}
.confirm .btn{width:100%;flex:none;min-height:54px;font-size:17px}
.confirm .btn:disabled{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;opacity:.85}

/* volado */
.volado{margin-top:16px;border:2px solid var(--line);border-radius:20px;padding:20px;background:var(--surface)}
.volado .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.volado small{display:block;color:var(--muted);font-size:13px}
.volado b{display:block;font:700 26px/1.05 var(--disp);text-transform:uppercase}
.coinbtn{width:100%;min-height:58px;margin-top:18px;border-radius:14px;border:0;background:var(--ball);color:var(--ball-ink);font:800 20px var(--disp);display:flex;align-items:center;justify-content:center;gap:10px}
.coin{display:inline-block;font-size:26px}
.coin.flip{animation:flip 1s ease-in-out}
@keyframes flip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-22px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1800deg)}}
@media (prefers-reduced-motion:reduce){.coin.flip{animation:none}}

/* queue */
.queue{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:8px}
.queue li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:600;min-height:48px}
.queue li .o{font:700 15px var(--disp);color:var(--muted);min-width:22px}
.queue li em{font-style:normal;font-size:12px;font-weight:700;background:var(--ball);color:var(--ball-ink);padding:2px 8px;border-radius:999px}
.queue li.next{border-color:var(--court)}
.queue li .qn{flex:1;min-width:0;overflow-wrap:anywhere}
.queue li .qn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.queue li.away{border-style:dashed;color:var(--muted)}
.mini{min-height:38px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--body);padding:0 12px;white-space:nowrap}
.mini.go{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);font-weight:700}
.att{height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--muted);font:600 14px var(--body);padding:0 12px;white-space:nowrap}
.att.on{border-color:var(--danger);color:var(--danger);font-weight:700}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:8px;min-width:0}
.slot span{font:700 15px var(--disp);color:var(--muted);min-width:22px}
.sel{width:100%;min-width:0;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);padding:0 8px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 12px var(--body);color:var(--muted);padding:6px 3px;text-align:center}
.tbl td{padding:9px 3px;text-align:center;border-top:1px solid var(--line);font-size:15px}
.tbl .l{text-align:left}
.tbl td.pts{font:800 24px var(--disp)}
.tbl td.nm{font-weight:600;text-align:left}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;background:var(--surface2)}
.rk.r1{background:var(--ball);color:var(--ball-ink)}
.pos{color:var(--good)}.neg{color:var(--danger)}
.copybtn{border:0;background:transparent;color:var(--court);font:700 14px var(--body);padding:8px 0;min-height:40px}
:root[data-theme="dark"] .copybtn{color:var(--ball)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .copybtn{color:var(--ball)}}
.copybox{width:100%;height:120px;margin-top:8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:14px var(--body);padding:8px}

/* history */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:22px 1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.hist .n{font:700 15px var(--disp);color:var(--muted)}
.hist .t{color:var(--muted)}
.hist .t.w{color:var(--ink);font-weight:700}
.hist .t.r{text-align:right}
.hist .sc{font:800 20px var(--disp);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;margin:0}

/* final */
.final{margin-top:16px;background:var(--court);color:#fff;border-radius:20px;padding:26px 24px;position:relative;text-align:left}
.final::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.55);border-radius:13px;pointer-events:none}
.final .k{font-size:14px;opacity:.9}
.final .champ{font:800 46px/1 var(--disp);text-transform:uppercase;margin:6px 0 4px;color:var(--ball);overflow-wrap:anywhere}
.final .pts{font-size:16px;opacity:.95}
.final ol{list-style:none;margin:18px 0 0;padding:0}
.final li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.3);font-weight:600}
.final li span:last-child{font:800 20px var(--disp)}

/* rules */
details.rules{margin-top:22px;border-top:1px solid var(--line)}
details.rules summary{min-height:46px;display:flex;align-items:center;font:700 20px var(--disp);cursor:pointer}
details.rules ul{margin:0 0 6px;padding-left:18px;font-size:15px}
details.rules li{margin:7px 0}

/* setup */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.row .num{font:700 15px var(--disp);color:var(--muted)}
.row input{min-width:0;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px var(--body);padding:0 12px}
.preview{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.preview .vs{display:grid;gap:2px;margin:4px 0 14px}
.preview .vs b{font:800 26px/1.1 var(--disp);text-transform:uppercase}
.preview .vs span{color:var(--muted);font-size:14px}
.preview p{margin:0 0 6px;color:var(--muted);font-size:13px}
.setup-total{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.setup-total strong{font:800 28px var(--disp)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="ball" aria-hidden="true"></span><h1>Copa Gana o Asa</h1></div>
    <p class="sub">Americano de pádel: 8 jugadores, una cancha, el ganador se queda</p>
  </header>
  <main id="setup" hidden></main>
  <main id="play" hidden></main>
</div>

<script>
(function(){
'use strict';
var KEY='padel-americano-v2';
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rnd(n){
  try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
  catch(e){return Math.floor(Math.random()*n);}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function defaultSetup(){
  return {
    names:['Miguel','Juan','Felipe','Daniel','Jaime','David','Luis','Oscar'],
    away:[false,false,false,false,false,false,false,false],
    draw:null
  };
}
function fresh(){
  return {view:'setup',setup:defaultSetup(),total:10,roster:[],matches:[],queue:[],pending:null,absent:[],snaps:[]};
}
function load(){
  try{
    var v=localStorage.getItem(KEY);
    if(!v) return null;
    var o=JSON.parse(v);
    if(o && o.view && o.setup && Array.isArray(o.setup.names) && o.setup.names.length===8){
      if(!Array.isArray(o.absent)) o.absent=[];
      if(!Array.isArray(o.setup.away)||o.setup.away.length!==8) o.setup.away=[false,false,false,false,false,false,false,false];
      return o;
    }
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var S=load()||fresh();
var UI={sel:null,flipping:false,armReset:false,armTimer:null,copyFail:''};

/* ---------- state helpers ---------- */
function played(){return S.matches.filter(function(m){return m.res;}).length;}
function current(){var m=S.matches[S.matches.length-1];return (m&&!m.res)?m:null;}
function snap(){
  S.snaps.push(JSON.stringify({matches:S.matches,queue:S.queue,pending:S.pending,absent:S.absent}));
  if(S.snaps.length>80) S.snaps.shift();
}
function nameError(){
  var n=S.setup.names.map(function(x){return x.trim();});
  if(n.some(function(x){return !x;})) return 'Faltan nombres.';
  var seen={};
  for(var i=0;i<n.length;i++){var k=n[i].toLowerCase();if(seen[k]) return 'Hay nombres repetidos.';seen[k]=1;}
  return '';
}

/* ---------- setup ---------- */
function isAway(n){return S.absent.indexOf(n)>=0;}
function trimmedNames(){return S.setup.names.map(function(x){return x.trim();});}
function setupError(){
  var e=nameError();
  if(e) return e;
  var st=S.setup;
  var present=st.away.filter(function(x){return !x;}).length;
  if(present<4) return 'Deben estar presentes al menos 4 jugadores para empezar.';
  var d=st.draw;
  if(d){
    var names=trimmedNames(),first=d.a.concat(d.b);
    for(var i=0;i<first.length;i++){
      var idx=names.indexOf(first[i]);
      if(idx>=0&&st.away[idx]) return first[i]+' no ha llegado y no puede estar en el partido 1.';
    }
  }
  return '';
}
function renderSetup(){
  var st=S.setup;
  var rows=st.names.map(function(n,i){
    return '<div class="row"><span class="num">'+(i+1)+'</span>'+
      '<input type="text" data-i="'+i+'" value="'+esc(n)+'" maxlength="14" aria-label="Jugador '+(i+1)+'" autocomplete="off">'+
      '<button type="button" class="att'+(st.away[i]?' on':'')+'" data-away="'+i+'" aria-pressed="'+(st.away[i]?'true':'false')+'">'+(st.away[i]?'No ha llegado':'Presente')+'</button></div>';
  }).join('');
  $('setup').innerHTML=
    rulesHTML(true)+
    '<section class="sec"><h2>Jugadores</h2><div class="rows">'+rows+'</div>'+
    '<p class="hint">Si alguien todavía no llega, márcalo como "No ha llegado". No juega hasta que lo marques presente en la fila.</p></section>'+
    '<section class="sec" id="drawSec"></section>';
  renderDraw();
}
function rulesHTML(open){
  return '<details class="rules"'+(open?' open':'')+'><summary>Cómo se juega</summary><ul>'+
    '<li>Somos 8 y hay una cancha. Cada partido es a 3 juegos.</li>'+
    '<li>Si tu pareja gana, te quedas pero te separas de ella y juegas con alguien nuevo. Si pierdes, te formas al final de la fila.</li>'+
    '<li>Los puntos son individuales: 1 por cada juego que gana tu pareja y 1 extra si ganan el partido.</li>'+
    '<li>Al terminar los partidos gana quien tenga más puntos. Los 3 últimos lugares pagan la carne asada.</li></ul></details>';
}
function slotHTML(idx,label,aria,all){
  var d=S.setup.draw,arr=d.a.concat(d.b,d.q),cur=arr[idx];
  return '<label class="slot">'+(label?'<span>'+label+'</span>':'')+'<select class="sel" data-slot="'+idx+'" aria-label="'+aria+'">'+
    all.map(function(n){return '<option value="'+esc(n)+'"'+(n===cur?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></label>';
}
function renderDraw(){
  var st=S.setup,nErr=nameError(),err=setupError(),d=st.draw;
  var html='<h2>Partido 1 y fila</h2>';
  if(err) html+='<p class="err">'+esc(err)+'</p>';
  if(d&&!nErr){
    var all=trimmedNames();
    html+='<div class="preview"><p>Pareja A</p><div class="slots">'+slotHTML(0,'','Pareja A, jugador 1',all)+slotHTML(1,'','Pareja A, jugador 2',all)+'</div>'+
      '<p>Pareja B</p><div class="slots">'+slotHTML(2,'','Pareja B, jugador 1',all)+slotHTML(3,'','Pareja B, jugador 2',all)+'</div>'+
      '<p>Fila de espera</p><div class="slots">'+slotHTML(4,'1º','Fila, lugar 1',all)+slotHTML(5,'2º','Fila, lugar 2',all)+slotHTML(6,'3º','Fila, lugar 3',all)+slotHTML(7,'4º','Fila, lugar 4',all)+'</div>'+
      '<p class="hint" style="margin-top:0">Puedes cambiar a cualquiera con los menús. Si eliges a alguien que ya está en otro lugar, se intercambian.</p></div>';
  }else if(!nErr){
    html+='<p class="empty">Sortea al azar o arma el partido a mano.</p>';
  }
  var noDraw=!!nErr||st.away.filter(function(x){return !x;}).length<4;
  html+='<div class="setup-total"><div class="stepper"><span>Partidos del torneo</span></div>'+
    '<div class="stepper"><button type="button" data-total="-1" aria-label="Menos partidos">−</button><strong>'+S.total+'</strong><button type="button" data-total="1" aria-label="Más partidos">+</button></div></div>'+
    '<div class="btns"><button type="button" class="btn" data-act="draw"'+(noDraw?' disabled':'')+'>'+(d?'Sortear otra vez':'Sortear')+'</button>'+
    '<button type="button" class="btn" data-act="manual"'+(noDraw?' disabled':'')+'>Armar a mano</button></div>'+
    '<div class="btns" style="margin-top:10px"><button type="button" class="btn primary" data-act="start"'+((!d||err)?' disabled':'')+'>Empezar torneo</button></div>';
  $('drawSec').innerHTML=html;
}
function setDraw(arr){
  S.setup.draw={a:[arr[0],arr[1]],b:[arr[2],arr[3]],q:[arr[4],arr[5],arr[6],arr[7]]};
}
function doDraw(){
  var st=S.setup,names=trimmedNames(),present=[],away=[];
  names.forEach(function(n,i){(st.away[i]?away:present).push(n);});
  shuffle(present);shuffle(away);
  setDraw(present.concat(away));
  save();renderDraw();
}
function manualDraw(){
  var st=S.setup,names=trimmedNames(),present=[],away=[];
  names.forEach(function(n,i){(st.away[i]?away:present).push(n);});
  setDraw(present.concat(away));
  save();renderDraw();
}
function startTournament(){
  var d=S.setup.draw;
  if(!d||setupError()) return;
  var names=trimmedNames();
  S.roster=names;
  S.absent=names.filter(function(n,i){return S.setup.away[i];});
  S.matches=[{a:d.a.slice(),b:d.b.slice(),res:null}];
  S.queue=d.q.slice();
  S.pending=null;S.snaps=[];UI.sel=null;
  S.view='play';
  save();show();
}

/* ---------- play logic ---------- */
function confirmResult(){
  var m=current();
  if(!m||!UI.sel) return;
  snap();
  m.res={w:UI.sel.w,lg:UI.sel.lg};
  var win=m.res.w==='a'?m.a:m.b, lose=m.res.w==='a'?m.b:m.a;
  var full=S.queue.concat(lose),ent=[],rest=[];
  full.forEach(function(n){
    if(ent.length<2&&!isAway(n)) ent.push(n); else rest.push(n);
  });
  S.queue=rest;
  S.pending={winners:win.slice(),entrants:ent};
  UI.sel=null;
  save();renderPlay();
  window.scrollTo({top:0,behavior:'smooth'});
}
function flip(){
  if(!S.pending||UI.flipping) return;
  UI.flipping=true;
  var c=$('coin');if(c) c.classList.add('flip');
  var b=$('flipbtn');if(b) b.disabled=true;
  setTimeout(function(){
    snap();
    var p=S.pending;
    var w1=p.winners[0],w2=p.winners[1],e1=p.entrants[0],e2=p.entrants[1];
    var heads=rnd(2)===0;
    var A=heads?[w1,e1]:[w1,e2];
    var B=heads?[w2,e2]:[w2,e1];
    S.matches.push({a:A,b:B,res:null});
    S.pending=null;UI.flipping=false;UI.sel=null;
    save();renderPlay();
  },1000);
}
function undo(){
  var s=S.snaps.pop();
  if(!s) return;
  var o=JSON.parse(s);
  S.matches=o.matches;S.queue=o.queue;S.pending=o.pending;S.absent=o.absent||S.absent;
  UI.sel=null;UI.flipping=false;
  save();renderPlay();
}
function setAway(i,flag){
  var n=S.queue[i];
  if(n===undefined) return;
  snap();
  var k=S.absent.indexOf(n);
  if(flag){
    if(k<0) S.absent.push(n);
  }else{
    if(k>=0) S.absent.splice(k,1);
    S.queue.splice(i,1);S.queue.push(n);
  }
  save();renderPlay();
}
function changeTotal(d){
  var min=S.view==='play'?Math.max(1,played()):4;
  S.total=Math.max(min,Math.min(30,S.total+d));
  save();
  if(S.view==='play') renderPlay(); else renderDraw();
}
function resetTournament(){
  if(!UI.armReset){
    UI.armReset=true;
    clearTimeout(UI.armTimer);
    UI.armTimer=setTimeout(function(){UI.armReset=false;if(S.view==='play') renderPlay();},4000);
    renderPlay();
    return;
  }
  clearTimeout(UI.armTimer);UI.armReset=false;
  var keep=S.setup,tot=S.total;
  S=fresh();S.setup.names=keep.names;S.total=tot;
  UI.sel=null;
  save();show();
}

/* ---------- stats ---------- */
function computeRanked(){
  var s={};
  S.roster.forEach(function(n){s[n]={n:n,pj:0,pg:0,pts:0,gf:0,gc:0};});
  S.matches.forEach(function(m){
    if(!m.res) return;
    var win=m.res.w==='a'?m.a:m.b, lose=m.res.w==='a'?m.b:m.a, lg=m.res.lg;
    win.forEach(function(p){var x=s[p];x.pj++;x.pg++;x.pts+=4;x.gf+=3;x.gc+=lg;});
    lose.forEach(function(p){var x=s[p];x.pj++;x.pts+=lg;x.gf+=lg;x.gc+=3;});
  });
  var arr=Object.keys(s).map(function(k){var x=s[k];x.dif=x.gf-x.gc;return x;});
  function cmp(a,b){
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.pg!==a.pg) return b.pg-a.pg;
    return b.dif-a.dif;
  }
  arr.sort(function(a,b){return cmp(a,b)||a.n.localeCompare(b.n);});
  arr.forEach(function(x){x.rank=1+arr.filter(function(y){return cmp(y,x)<0;}).length;});
  return arr;
}

/* ---------- play render ---------- */
function progressHTML(p,fin){
  var n=fin?S.total:p+1;
  var pct=Math.round(Math.min(p,S.total)/S.total*100);
  return '<div class="prog"><div><small>'+(fin?'Partidos jugados':'Partido en juego')+'</small><span class="now">'+n+'</span><span class="of">de '+S.total+'</span></div>'+
    '<div class="stepper"><span>Total</span><button type="button" data-total="-1" aria-label="Menos partidos">−</button><button type="button" data-total="1" aria-label="Más partidos">+</button></div></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>';
}
function courtHTML(m){
  var sel=UI.sel;
  function half(k,pl,lab){
    var pills=[0,1,2].map(function(lg){
      var on=sel&&sel.w===k&&sel.lg===lg;
      return '<button type="button" class="pill'+(on?' on':'')+'" data-res="'+k+':'+lg+'" aria-pressed="'+(on?'true':'false')+'">3–'+lg+'</button>';
    }).join('');
    return '<div class="half"><div class="who">'+lab+'</div><div class="pl">'+esc(pl[0])+' <span class="amp">+</span> '+esc(pl[1])+'</div>'+
      '<div class="win-row"><span class="lbl">Si ganan</span>'+pills+'</div></div>';
  }
  var label='Elige el resultado';
  if(sel){
    var w=sel.w==='a'?m.a:m.b;
    label='Guardar: '+w[0]+' + '+w[1]+' ganan 3–'+sel.lg;
  }
  return '<div class="court">'+half('a',m.a,'Pareja A')+
    '<div class="net"><span class="ballmark"></span></div>'+
    half('b',m.b,'Pareja B')+
    '<div class="confirm"><button type="button" class="btn primary" data-act="confirm"'+(sel?'':' disabled')+'>'+esc(label)+'</button></div></div>';
}
function voladoHTML(){
  var p=S.pending;
  return '<div class="volado"><div class="cols">'+
    '<div><small>Se quedan y se separan</small><b>'+esc(p.winners[0])+'<br>'+esc(p.winners[1])+'</b></div>'+
    '<div><small>Entran de la fila</small><b>'+esc(p.entrants[0])+'<br>'+esc(p.entrants[1])+'</b></div></div>'+
    '<p class="hint">Cada uno de los que se quedan juega con uno de los que entran. El volado decide con quién.</p>'+
    '<button type="button" class="coinbtn" id="flipbtn" data-act="flip"><span class="coin" id="coin">🪙</span>Tirar volado</button></div>';
}
function finalHTML(ranked,p){
  var champs=ranked.filter(function(r){return r.rank===1;});
  var top=ranked.slice(0,3);
  return '<div class="final"><div class="k">'+(champs.length>1?'Empate en primer lugar':'Campeón del torneo')+' tras '+p+' partidos</div>'+
    '<div class="champ">'+champs.map(function(c){return esc(c.n);}).join(' y ')+'</div>'+
    '<div class="pts">'+champs[0].pts+' puntos</div>'+
    '<ol>'+top.map(function(r){return '<li><span>'+r.rank+'º '+esc(r.n)+'</span><span>'+r.pts+'</span></li>';}).join('')+'</ol></div>'+
    '<p class="hint">¿Quieren seguir jugando? Sube el total de partidos con el botón + de arriba.</p>';
}
function queueHTML(marked){
  var c=0;
  var items=S.queue.map(function(n,i){
    var away=isAway(n),nx=false;
    if(!away){c++;nx=marked&&c<=2;}
    return '<li class="'+(away?'away':nx?'next':'')+'"><span class="o">'+(i+1)+'º</span>'+
      '<span class="qn">'+esc(n)+(away?'<small>No ha llegado</small>':'')+'</span>'+(nx?'<em>entra</em>':'')+
      (away?'<button type="button" class="mini go" data-act="here" data-q="'+i+'">Ya llegó</button>'
           :'<button type="button" class="mini" data-act="gone" data-q="'+i+'">No está</button>')+'</li>';
  }).join('');
  return '<section class="sec"><h2>En la fila</h2><ol class="queue">'+items+'</ol>'+
    '<p class="hint">Si alguien no está, toca "No está" y se salta su turno. Cuando llegue, toca "Ya llegó" y se forma al final de la fila.</p></section>';
}
function tableHTML(ranked,p){
  var rows=ranked.map(function(r){
    var lead=p>0&&r.rank===1;
    var d=r.dif>0?'+'+r.dif:String(r.dif);
    return '<tr><td><span class="rk'+(lead?' r1':'')+'">'+r.rank+'</span></td><td class="nm">'+esc(r.n)+'</td>'+
      '<td class="pts">'+r.pts+'</td><td>'+r.pj+'</td><td>'+r.pg+'</td><td class="'+(r.dif>0?'pos':r.dif<0?'neg':'')+'">'+d+'</td></tr>';
  }).join('');
  return '<section class="sec"><div class="sec-head"><h2>Posiciones</h2><button type="button" class="copybtn" data-act="copy">Copiar tabla</button></div>'+
    '<table class="tbl"><thead><tr><th>#</th><th class="l" style="text-align:left">Jugador</th><th>Pts</th><th>PJ</th><th>PG</th><th>Dif</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    (UI.copyFail?'<textarea class="copybox" readonly>'+esc(UI.copyFail)+'</textarea>':'')+
    '<p class="hint">Puntos: 1 por cada juego que gana tu pareja y 1 extra si ganan el partido. Desempate: partidos ganados y luego diferencia de juegos.</p></section>';
}
function historyHTML(){
  var list=[];
  S.matches.forEach(function(m,i){if(m.res) list.push({m:m,i:i});});
  var body;
  if(!list.length){
    body='<p class="empty">Todavía no hay partidos jugados.</p>';
  }else{
    body='<ul class="hist">'+list.reverse().map(function(x){
      var m=x.m,w=m.res.w,sa=w==='a'?3:m.res.lg,sb=w==='b'?3:m.res.lg;
      return '<li><span class="n">'+(x.i+1)+'</span><span class="t'+(w==='a'?' w':'')+'">'+esc(m.a[0])+' + '+esc(m.a[1])+'</span>'+
        '<span class="sc">'+sa+'–'+sb+'</span><span class="t r'+(w==='b'?' w':'')+'">'+esc(m.b[0])+' + '+esc(m.b[1])+'</span></li>';
    }).join('')+'</ul>';
  }
  return '<section class="sec"><h2>Resultados</h2>'+body+'</section>';
}
function actionsHTML(){
  return '<div class="btns"><button type="button" class="btn" data-act="undo"'+(S.snaps.length?'':' disabled')+'>Deshacer</button>'+
    '<button type="button" class="btn danger" data-act="reset">'+(UI.armReset?'¿Seguro? Toca otra vez':'Nuevo torneo')+'</button></div>';
}
function renderPlay(){
  var p=played(),fin=p>=S.total,ranked=computeRanked();
  var html='<section style="margin-top:0">'+progressHTML(p,fin);
  if(fin) html+=finalHTML(ranked,p);
  else if(current()) html+=courtHTML(current());
  else if(S.pending) html+=voladoHTML();
  html+='</section>';
  if(!fin) html+=queueHTML(!!current());
  html+=tableHTML(ranked,p)+historyHTML()+rulesHTML(false)+actionsHTML();
  $('play').innerHTML=html;
}

/* ---------- copy ---------- */
function tableText(){
  var r=computeRanked(),p=played(),medals=['🥇','🥈','🥉'];
  var lines=['🎾 Copa Gana o Asa, tras '+p+' partidos'];
  r.forEach(function(x){
    var tag=(p>0&&x.rank<=3)?medals[x.rank-1]:x.rank+'.';
    lines.push(tag+' '+x.n+': '+x.pts+' pts ('+x.pg+' ganados de '+x.pj+')');
  });
  return lines.join('\n');
}
function copyTable(btn){
  var txt=tableText(),ok=false;
  function done(good){
    if(good){
      UI.copyFail='';
      var old=btn.textContent;btn.textContent='Copiado';
      setTimeout(function(){btn.textContent=old;},1600);
    }else{
      UI.copyFail=txt;renderPlay();
    }
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){done(true);},function(){fallback();});
      return;
    }
  }catch(e){}
  fallback();
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      ok=document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ok=false;}
    done(ok);
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button[data-total]');
  if(t&&!t.disabled){changeTotal(parseInt(t.getAttribute('data-total'),10));return;}
});
$('setup').addEventListener('input',function(e){
  var el=e.target;
  if(el.tagName!=='INPUT') return;
  S.setup.names[parseInt(el.getAttribute('data-i'),10)]=el.value;
  S.setup.draw=null;
  save();renderDraw();
});
$('setup').addEventListener('change',function(e){
  var el=e.target;
  if(el.tagName!=='SELECT') return;
  var d=S.setup.draw;
  if(!d) return;
  var idx=parseInt(el.getAttribute('data-slot'),10);
  var arr=d.a.concat(d.b,d.q),j=arr.indexOf(el.value);
  if(j>=0&&j!==idx){var t=arr[idx];arr[idx]=arr[j];arr[j]=t;setDraw(arr);save();}
  renderDraw();
});
$('setup').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b||b.disabled) return;
  if(b.hasAttribute('data-away')){
    var ai=parseInt(b.getAttribute('data-away'),10);
    S.setup.away[ai]=!S.setup.away[ai];
    S.setup.draw=null;save();renderSetup();
    return;
  }
  var a=b.getAttribute('data-act');
  if(a==='draw') doDraw();
  else if(a==='manual') manualDraw();
  else if(a==='start') startTournament();
});
$('play').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b||b.disabled) return;
  var r=b.getAttribute('data-res');
  if(r){var p=r.split(':');UI.sel={w:p[0],lg:parseInt(p[1],10)};renderPlay();return;}
  var a=b.getAttribute('data-act');
  if(a==='confirm') confirmResult();
  else if(a==='flip') flip();
  else if(a==='undo') undo();
  else if(a==='reset') resetTournament();
  else if(a==='copy') copyTable(b);
  else if(a==='gone') setAway(parseInt(b.getAttribute('data-q'),10),true);
  else if(a==='here') setAway(parseInt(b.getAttribute('data-q'),10),false);
});

/* ---------- boot ---------- */
function show(){
  var play=S.view==='play';
  $('setup').hidden=play;$('play').hidden=!play;
  if(play) renderPlay(); else renderSetup();
  window.scrollTo(0,0);
}
show();
})();
</script>
